<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>인스타 다운로더</title>
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
<meta name="theme-color" content="#000000" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="인스타DL" />
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --card: #121214;
    --surface: #1c1c1f;
    --surface2: #252528;
    --text: #f5f5f7;
    --muted: #8e8e93;
    --accent: #e1306c;
    --accent-grad: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    --border: #2c2c2f;
    --error: #ff453a;
    --ok: #32d74b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
  }
  h1 {
    font-size: 23px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p.sub {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  input[type="url"] {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    transition: border-color 0.15s;
  }
  input[type="url"]::placeholder {
    color: var(--muted);
  }
  input[type="url"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(225, 48, 108, 0.25);
  }
  #pasteBtn {
    flex: 0 0 auto;
    width: 52px;
    padding: 14px 0;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
  }
  button {
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: var(--accent-grad);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }
  button:active {
    transform: scale(0.98);
  }
  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none;
  }
  .status {
    margin-top: 16px;
    font-size: 14px;
    min-height: 20px;
  }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }
  .preview {
    display: none;
    margin-top: 20px;
  }
  .preview.show { display: block; }
  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 14px;
  }
  .gallery.single {
    grid-template-columns: 1fr;
  }
  .gallery-item {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .gallery-item img, .gallery-item video {
    width: 100%;
    display: block;
    aspect-ratio: 1 / 1;
    object-fit: cover;
  }
  .gallery.single .gallery-item img,
  .gallery.single .gallery-item video {
    aspect-ratio: auto;
  }
  .gallery-item .badge {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    color: white;
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 8px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
  }
  .save-btn {
    flex: 1;
  }
  .save-btn.secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .hint {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>인스타 다운로더</h1>
    <p class="sub">게시물 또는 릴스 링크를 붙여넣으면 사진·영상을 전부 받아옵니다.</p>
    <form id="form">
      <div class="input-row">
        <input type="url" id="url" placeholder="https://www.instagram.com/reel/..." required />
        <button type="button" id="pasteBtn" title="붙여넣기">📋</button>
      </div>
      <button type="submit" id="submitBtn">다운로드</button>
    </form>
    <div class="status" id="status"></div>

    <div class="preview" id="preview">
      <div class="gallery" id="gallery"></div>
      <div class="btn-row">
        <button type="button" class="save-btn" id="shareSaveBtn">📱 전체 사진 앱에 저장</button>
        <button type="button" class="save-btn secondary" id="fileSaveBtn">전체 파일로 저장</button>
      </div>
      <button type="button" class="save-btn secondary" id="notionSaveBtn" style="margin-top: 8px; width: 100%;">📝 캡션·본문 노션에 저장</button>
      <p class="hint">아이폰/아이패드: "사진 앱에 저장"을 누르면 나오는 공유 시트에서 <b>"이미지 저장" / "비디오 저장"</b>을 선택하면 사진 앱에 한 번에 들어갑니다.<br>
      또는 각 사진·영상을 <b>길게 눌러</b> "이미지 저장"을 선택해도 됩니다.</p>
    </div>
  </div>

<script>
  const form = document.getElementById('form');
  const urlInput = document.getElementById('url');
  const submitBtn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const preview = document.getElementById('preview');
  const gallery = document.getElementById('gallery');
  const shareSaveBtn = document.getElementById('shareSaveBtn');
  const fileSaveBtn = document.getElementById('fileSaveBtn');
  const notionSaveBtn = document.getElementById('notionSaveBtn');
  const pasteBtn = document.getElementById('pasteBtn');

  let currentFiles = [];
  let currentObjectUrls = [];
  let currentJobId = null;

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = 'status' + (cls ? ' ' + cls : '');
  }

  function cleanupPreview() {
    currentObjectUrls.forEach((u) => URL.revokeObjectURL(u));
    currentObjectUrls = [];
    currentFiles = [];
    gallery.innerHTML = '';
    preview.classList.remove('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const url = urlInput.value.trim();
    setStatus('');
    cleanupPreview();
    submitBtn.disabled = true;
    submitBtn.textContent = '분석 중...';

    try {
      const prepRes = await fetch('/api/prepare', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ url })
      });

      const prepData = await prepRes.json().catch(() => ({}));
      if (!prepRes.ok) {
        throw new Error(prepData.error || `분석에 실패했습니다. (HTTP ${prepRes.status})`);
      }

      const { jobId } = prepData;
      currentJobId = jobId;

      // 다운로드 자체는 서버에서 백그라운드로 진행된다(모바일 통신망에서 긴 요청 하나를
      // 오래 붙잡고 있으면 응답 전에 연결이 끊기는 경우가 있어, 짧은 폴링으로 진행 확인).
      let items = null;
      const pollStartedAt = Date.now();
      const POLL_TIMEOUT_MS = 120_000;
      while (true) {
        if (Date.now() - pollStartedAt > POLL_TIMEOUT_MS) {
          throw new Error('다운로드가 너무 오래 걸립니다. 잠시 후 다시 시도해주세요.');
        }
        const statusRes = await fetch(`/api/status/${jobId}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        const statusData = await statusRes.json().catch(() => ({}));
        if (!statusRes.ok) {
          throw new Error(statusData.error || `상태 확인에 실패했습니다. (HTTP ${statusRes.status})`);
        }
        if (statusData.status === 'error') {
          throw new Error(statusData.error || '다운로드에 실패했습니다.');
        }
        if (statusData.status === 'done') {
          items = statusData.items;
          break;
        }
        // 서버가 알려주는 현재 진행 단계(예: "다운로드 중"/"OCR 처리 중")를 보여준다.
        submitBtn.textContent = (statusData.step || '분석 중') + '...';
        await new Promise((resolve) => setTimeout(resolve, 1500));
      }

      if (!items || items.length === 0) {
        throw new Error('다운로드할 사진/영상을 찾지 못했습니다.');
      }

      gallery.className = 'gallery' + (items.length === 1 ? ' single' : '');

      for (let i = 0; i < items.length; i++) {
        submitBtn.textContent = `받는 중... (${i + 1}/${items.length})`;
        const item = items[i];
        const fileRes = await fetch(`/api/file/${jobId}/${encodeURIComponent(item.filename)}`, {
          headers: { 'ngrok-skip-browser-warning': 'true' }
        });
        if (!fileRes.ok) continue;

        const blob = await fileRes.blob();
        if (!blob || blob.size === 0) continue;

        const file = new File([blob], item.filename, { type: blob.type });
        const objectUrl = URL.createObjectURL(blob);
        currentFiles.push(file);
        currentObjectUrls.push(objectUrl);

        const cell = document.createElement('div');
        cell.className = 'gallery-item';

        const el = document.createElement(item.type === 'video' ? 'video' : 'img');
        el.src = objectUrl;
        if (item.type === 'video') {
          el.controls = true;
          el.playsInline = true;
          el.muted = true;
        } else {
          el.alt = item.filename;
        }
        cell.appendChild(el);

        if (items.length > 1) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = `${i + 1}/${items.length}`;
          cell.appendChild(badge);
        }

        gallery.appendChild(cell);
      }

      if (currentFiles.length === 0) {
        throw new Error('파일을 받아오지 못했습니다.');
      }

      preview.classList.add('show');
      setStatus(`다운로드 완료! (${currentFiles.length}개) 아래에서 사진 앱에 저장하세요.`, 'ok');
    } catch (err) {
      setStatus('오류: ' + err.message, 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = '다운로드';
    }
  });

  shareSaveBtn.addEventListener('click', async () => {
    if (currentFiles.length === 0) return;
    if (navigator.canShare && navigator.canShare({ files: currentFiles })) {
      try {
        await navigator.share({ files: currentFiles });
      } catch (err) {
        if (err.name !== 'AbortError') {
          setStatus('공유 시트를 열 수 없습니다. 각 이미지를 길게 눌러 저장해보세요.', 'error');
        }
      }
    } else {
      setStatus('이 브라우저는 한 번에 공유 저장을 지원하지 않습니다. 각 이미지·영상을 길게 눌러 저장해주세요.', 'error');
    }
  });

  fileSaveBtn.addEventListener('click', () => {
    currentFiles.forEach((file, i) => {
      const link = document.createElement('a');
      link.href = currentObjectUrls[i];
      link.download = file.name;
      document.body.appendChild(link);
      link.click();
      link.remove();
    });
  });

  notionSaveBtn.addEventListener('click', async () => {
    if (!currentJobId) return;
    notionSaveBtn.disabled = true;
    notionSaveBtn.textContent = '노션에 저장 중...';
    try {
      const res = await fetch('/api/notion-save', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ jobId: currentJobId })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `노션 저장에 실패했습니다. (HTTP ${res.status})`);
      }
      setStatus('노션에 저장 완료! (데이터베이스에 추가됨)', 'ok');
    } catch (err) {
      setStatus('노션 저장 오류: ' + err.message, 'error');
    } finally {
      notionSaveBtn.disabled = false;
      notionSaveBtn.textContent = '📝 캡션·본문 노션에 저장';
    }
  });

  pasteBtn.addEventListener('click', async () => {
    if (!navigator.clipboard || !navigator.clipboard.readText) {
      setStatus('이 브라우저는 자동 붙여넣기를 지원하지 않습니다. 길게 눌러 직접 붙여넣어주세요.', 'error');
      return;
    }
    try {
      const text = await navigator.clipboard.readText();
      urlInput.value = text.trim();
      urlInput.focus();
    } catch (err) {
      setStatus('클립보드 읽기 권한이 없습니다. 길게 눌러 직접 붙여넣어주세요.', 'error');
    }
  });
</script>
</body>
</html>
